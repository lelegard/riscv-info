name: Test on RISE Scaleway-provided runner
on:
  workflow_dispatch: # manual trigger
jobs:
  test:
    runs-on: ubuntu-24.04-riscv
    steps:
    - name: Get repo
      uses: actions/checkout@master
    - name: Install prerequisites
      run: sudo apt install -y python3-yaml zip
    - name: Run riscv_info
      run: ./riscv_info.py --verbose | tee verbose.scaleway.emrv1
    - name: Collect system information
      run: |
        echo "=== uname -a"
        uname -a | tee uname.scaleway.emrv1
        echo "=== cpuinfo"
        cat /proc/cpuinfo | tee cpuinfo.scaleway.emrv1
        echo "=== isa-extensions"
        find /proc/device-tree -iname 'riscv,isa*' | tee isa-extensions-list.scaleway.emrv1
        if [[ -s isa-extensions-list.scaleway.emrv1 ]]; then
            cat $(head -1 isa-extensions-list.scaleway.emrv1) | tee isa-extensions.scaleway.emrv1
        fi
        zip info.zip *.scaleway.emrv1
    - name: Publish results
      uses: actions/upload-artifact@v4
      with:
        name: info
        path: info.zip
